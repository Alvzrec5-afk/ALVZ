[build]
  command = "npm run build"
  publish = ".next"
  # Pas de publication (ni de crédits consommés) quand seuls la doc, la mémoire du projet ou l'application Mac changent.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CLAUDE.md' ':(exclude).claude' ':(exclude)docs' ':(exclude)desktop' ':(exclude).github'"

[build.environment]
  NODE_VERSION = "22"

# Active explicitement le moteur Next.js de Netlify (pages serveur, routes API).
[[plugins]]
  package = "@netlify/plugin-nextjs"
