[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alvz-grade"
version = "0.1.0"
description = "Un panneau de curseurs pour étalonner dans DaVinci Resolve Studio."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
